<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swift News Search</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <h1>Swift News</h1>
    <form id="search-form" class="search-form">
      <label class="sr-only" for="search-box">Search news</label>
      <input id="search-box" type="search" maxlength="300" placeholder="Search the news archive…" required autofocus>
      <button type="submit">Search</button>
    </form>
    <p id="status" class="status" aria-live="polite"></p>
    <section id="results" aria-label="Search results"></section>
    <nav id="pagination" class="pagination" aria-label="Search result pages"></nav>
  </main>
  <script>
    const form = document.querySelector('#search-form');
    const box = document.querySelector('#search-box');
    const status = document.querySelector('#status');
    const results = document.querySelector('#results');
    const pagination = document.querySelector('#pagination');
    const pageSize = 10;
    let currentQuery = '';

    form.addEventListener('submit', event => {
      event.preventDefault();
      const query = box.value.trim();
      if (query) loadPage(query, 1);
    });

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
      } catch (_) { return ''; }
    }

    function imageFallback() {
      const fallback = document.createElement('div');
      fallback.className = 'image-fallback';
      fallback.setAttribute('aria-hidden', 'true');
      fallback.innerHTML = '<span>Swift</span><small>NEWS</small>';
      return fallback;
    }

    function addResult(item) {
      const article = document.createElement('article');
      article.className = 'result';
      const imageUrl = safeUrl(item.url_to_image);
      if (imageUrl) {
        const image = document.createElement('img');
        image.src = imageUrl;
        image.alt = '';
        image.loading = 'lazy';
        image.referrerPolicy = 'no-referrer';
        image.addEventListener('error', () => image.replaceWith(imageFallback()), {once: true});
        article.append(image);
      } else article.append(imageFallback());
      const content = document.createElement('div');
      const title = document.createElement('h2');
      const link = document.createElement('a');
      link.textContent = item.title || 'Untitled article';
      const articleUrl = safeUrl(item.url);
      if (articleUrl) {
        link.href = articleUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
      title.append(link);
      const description = document.createElement('p');
      description.textContent = item.description || 'No description available.';
      content.append(title, description);
      article.append(content);
      results.append(article);
    }

    function pageButton(label, page, disabled = false) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.disabled = disabled;
      button.addEventListener('click', () => loadPage(currentQuery, page));
      return button;
    }

    function renderPagination(page, total) {
      pagination.replaceChildren();
      const pages = Math.ceil(total / pageSize);
      if (pages <= 1) return;
      pagination.append(pageButton('← Previous', page - 1, page === 1));
      const label = document.createElement('span');
      label.textContent = `Page ${page} of ${pages}`;
      pagination.append(label, pageButton('Next →', page + 1, page === pages));
    }

    async function loadPage(query, page) {
      currentQuery = query;
      status.textContent = 'Searching…';
      results.replaceChildren();
      pagination.replaceChildren();
      const started = performance.now();
      try {
        const params = new URLSearchParams({q: query, page, page_size: pageSize});
        const response = await fetch(`/search?${params}`);
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || 'Search failed');
        body.results.forEach(addResult);
        const seconds = ((performance.now() - started) / 1000).toFixed(2);
        status.textContent = `${body.total_results.toLocaleString()} results in ${seconds}s`;
        if (!body.results.length) status.textContent = 'No results found.';
        renderPagination(body.page, body.total_results);
      } catch (error) { status.textContent = error.message; }
    }
  </script>
</body>
</html>
